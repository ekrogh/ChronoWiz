name: chronowiz
title: ChronoWiz
base: core24
version: "1.4.12"
summary: Calculates times and time spans
description: |
  chronowiz
  calculates time and date from start-/end time
  and time span, or time span from start- and end time and date
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots

# TODO: Replace with your preferred contact info.
contact: http://eksit.dk

website: http://eksit.dk
source-code: http://eksit.dk
issues: http://eksit.dk
donation: http://eksit.dk

# SPDX license expression
license: MIT

platforms:
  amd64:
  arm64:
  armhf:

parts:
  chronowiz:
    # Source paths are relative to the project root (where snapcraft.yaml is discovered).
    source: .
    plugin: dotnet
    # .NET plugin (v2) settings
    dotnet-version: "10.0"
    dotnet-configuration: Release
    dotnet-project: ChronoWiz.Avalonia.Linux/ChronoWiz.Avalonia.Linux.csproj
    dotnet-self-contained: true
    build-packages:
      - libglib2.0-bin
      # - curl
      # - nuget
      - apt-transport-https
      - dirmngr
      # - libgtk2.0-cil-dev
      # - libglade2.0-cil-dev
      # - mono-devel
      # - msbuild
    stage-packages:
      - libproxy1-plugin-networkmanager
      - libproxy1-plugin-gsettings
      # - gtk-sharp2
      # - libglade2.0-cil
      # - mono-complete

    override-prime: |
      craftctl default
      # .NET ships a tracepoint provider that depends on liblttng-ust.so.0 on some distros.
      # It's optional for app execution; removing it avoids pulling in legacy LTTng ABI.
      find "$CRAFT_PRIME" -name libcoreclrtraceptprovider.so -type f -delete || true
      # Ensure GIO finds proxy resolver modules without creating a broken user cache.
      for d in "$CRAFT_PRIME"/usr/lib/*/gio/modules; do
        [ -d "$d" ] && gio-querymodules "$d" || true
      done

apps:
  chronowiz:
    extensions: [gnome]
    # Produced by dotnet publish for linux (see AssemblyName in the csproj).
    command: ChronoWiz
    plugs:
      - home

lint:
  ignore:
    # Dynamically loaded by GIO; linter can't see the runtime dlopen usage.
    - library:
        - usr/lib/*/libproxy.so.*
